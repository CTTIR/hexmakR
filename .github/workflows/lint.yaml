on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions: read-all

jobs:
  lint:
    uses: CTTIR/.github/.github/workflows/lint.yaml@main
    with:
      # Existing report-only policy. The dated validation record distinguishes
      # package style findings from preserved source-kit and fixture findings.
      blocking: false

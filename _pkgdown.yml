url: https://cttir.github.io/hexmakR/
template:
  includes:
    in_header: |
      <meta name="theme-color" content="#1565c0">
      <script defer data-domain="cttir.github.io/hexmakr" src="https://analytics.hellebo.de/js/script.file-downloads.outbound-links.js"></script>
  package: themakR
development:
  mode: auto
destination: site
reference:
  - title: CTTIR library and project logos
    desc: >
      Start a logo, edit its parts, reuse artwork from the CTTIR v5 library,
      and save or export the result.
    contents:
      - hex_catalog
      - hex_asset
      - hex_design
      - logo_design
      - hex_palette
      - hex_grob
      - print.hex_design
      - hex_layers
      - hex_edit_layer
      - hex_move_layer
      - hex_add_part
      - hex_import_art
      - hex_reuse_part
      - hex_duplicate_part
      - hex_label_layer
      - hex_groups
      - hex_export
      - hex_save_design
      - hex_recipe
      - hex_render_catalog
  - title: Create and export
    desc: Classic ggplot2 stickers and their PNG and SVG export.
    contents:
      - hex_sticker
      - save_hex
      - save_hex_svg
  - title: Themes and icons
    desc: Built-in colour themes and icons for classic stickers and logos.
    contents:
      - hexmakr_icons
      - hexmakr_themes
      - hexmakr_preview_theme
  - title: Interactive application
    desc: The Shiny designer for new logos and the classic sticker editor.
    contents:
      - hexmakr_app
articles:
  - title: Guides
    navbar: ~
    contents:
      - getting-started
      - cttir-library
      - programmatic-usage
      - shiny-app
